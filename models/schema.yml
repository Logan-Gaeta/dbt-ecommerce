version: 2

seeds:
  - name: raw_customers
    description: "Synthetic customer records (seeded CSV)."
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: raw_products
    description: "Synthetic product catalog (seeded CSV)."
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: raw_orders
    description: "Synthetic orders (seeded CSV)."
    columns:
      - name: order_id
        tests: [unique, not_null]

models:
  - name: stg_orders
    description: "Cleaned orders; status normalized, line_total computed."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'pending', 'cancelled', 'returned']

  - name: dim_customers
    description: "One row per customer with lifetime aggregates."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: "One row per product with demand aggregates."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: fct_orders
    description: "One row per order, enriched. Grain: order_id."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
